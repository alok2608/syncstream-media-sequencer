# Render Blueprint: one Go web service plus a managed PostgreSQL instance.
#
# Deploy with:  Render dashboard -> New -> Blueprint -> point at this repository.
# After the first deploy, set FRONTEND_URL to your Vercel URL.
services:
  - type: web
    name: syncstream-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      # Supplied automatically from the database defined below.
      - key: DATABASE_URL
        fromDatabase:
          name: syncstream-db
          property: connectionString

      # Set this to your deployed frontend origin once Vercel has given you a
      # URL, e.g. https://syncstream.vercel.app. Comma-separate multiple
      # origins, or use "*" to allow any origin.
      - key: FRONTEND_URL
        sync: false

      # Seed the three demo windows on first boot (no-op once data exists).
      - key: AUTO_SEED
        value: "true"

      # How far ahead a global sync is scheduled so every client can prepare.
      - key: SYNC_LEAD_TIME_MS
        value: "1000"

databases:
  - name: syncstream-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
